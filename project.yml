name: PlaylistCreator
options:
  bundleIdPrefix: org.chrisbrooks
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  MARKETING_VERSION: 1.0.0
  CURRENT_PROJECT_VERSION: 1

targets:
  PlaylistCreator:
    type: application
    platform: iOS
    sources:
      - path: PlaylistCreator
        excludes:
          - "*.md"
    info:
      path: PlaylistCreator/Info.plist
      properties:
        CFBundleDisplayName: Playlist Creator
        CFBundleExecutable: PlaylistCreator
        CFBundleIdentifier: org.chrisbrooks.playlistcreator
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: PlaylistCreator
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSHumanReadableCopyright: "Copyright © 2024. All rights reserved."
        NSAppleMusicUsageDescription: "This app needs access to Apple Music to search for songs and create playlists based on your audio content."
        NSMicrophoneUsageDescription: "This app needs access to the microphone to record audio for transcription."
        NSPhotoLibraryUsageDescription: "This app needs access to your photo library to import video files."
        MusicKitDeveloperTeamIdentifier: "JFK2G5292Q"
    settings:
      PRODUCT_NAME: PlaylistCreator
      PRODUCT_BUNDLE_IDENTIFIER: org.chrisbrooks.playlistcreator
      INFOPLIST_FILE: PlaylistCreator/Info.plist
      CODE_SIGN_ENTITLEMENTS: PlaylistCreator/PlaylistCreator.entitlements
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "JFK2G5292Q"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_ASSET_PATHS: PlaylistCreator/Preview\ Content
      ENABLE_PREVIEWS: true
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_MACCATALYST: false

  PlaylistCreatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlaylistCreatorTests
    dependencies:
      - target: PlaylistCreator
    settings:
      PRODUCT_NAME: PlaylistCreatorTests
      PRODUCT_BUNDLE_IDENTIFIER: org.chrisbrooks.playlistcreatorTests
      BUNDLE_LOADER: $(TEST_HOST)
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/PlaylistCreator.app/PlaylistCreator
      GENERATE_INFOPLIST_FILE: true

schemes:
  PlaylistCreator:
    build:
      targets:
        PlaylistCreator: all
        PlaylistCreatorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PlaylistCreatorTests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release